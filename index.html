<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Videocut</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main id="app">
      <section class="row">
        <button id="open-video">Open video…</button>
        <span id="clip-info">Drop a video here or click Open</span>
      </section>

      <section id="stage">
        <video id="video" playsinline></video>
        <div id="crop" hidden></div>
      </section>

      <section class="transport-row">
        <span id="time-readout">0:00.0</span>
        <div class="transport">
          <button id="btn-start" title="Jump to in point" aria-label="Jump to in point"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
          <button id="btn-back" title="Previous frame (Left arrow; Shift = 1 second)" aria-label="Previous frame"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg></button>
          <button id="play" class="play" title="Play / Pause (Space)" aria-label="Play or pause">
            <svg id="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
            <svg id="icon-pause" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
          </button>
          <button id="btn-forward" title="Next frame (Right arrow; Shift = 1 second)" aria-label="Next frame"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.6 16.6 10 18l6-6-6-6-1.4 1.4 4.6 4.6z"/></svg></button>
          <button id="btn-end" title="Jump to out point" aria-label="Jump to out point"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
        </div>
        <label class="crop-toggle"><input id="crop-enabled" type="checkbox" checked /> Crop to 9:16</label>
      </section>

      <section>
        <div id="track">
          <div id="range"></div>
          <div id="handle-in" class="handle"></div>
          <div id="handle-out" class="handle"></div>
          <div id="playhead"></div>
        </div>
        <div class="row">
          <button id="set-in">Set in (I)</button>
          <span id="in-readout">0:00.00</span>
          <button id="set-out">Set out (O)</button>
          <span id="out-readout">0:00.00</span>
          <span id="len-readout"></span>
        </div>
      </section>

      <section class="row">
        <button id="open-song">Choose song… (optional)</button>
        <span id="song-name">No song — the clip keeps its own audio</span>
        <button id="clear-song" hidden>Remove song</button>
        <label>Start at <input id="song-start" value="0:00" size="6" /></label>
        <label><input id="preview-song" type="checkbox" /> Preview with song</label>
      </section>
      <p id="song-warning" class="warning" hidden></p>

      <section class="row">
        <button id="export" class="primary">Export…</button>
        <button id="cancel" hidden>Cancel</button>
        <progress id="progress" max="100" value="0" hidden></progress>
      </section>
      <p id="status"></p>
    </main>
    <audio id="audio"></audio>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
